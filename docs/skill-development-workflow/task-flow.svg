<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="970" viewBox="0 0 1200 970" role="img" aria-labelledby="title desc">
<title id="title">完整任务流：用户提出需求，角色按文档接续</title><desc id="desc">规划者形成架构和任务，协调者组织三路开发与独立测试，审核门禁后合入并继续派单。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#0f172a}.heading{font-size:21px;font-weight:700}.line{font-size:16px}.note{font-size:14px;fill:#475569}</style>
<rect width="1200" height="970" fill="#ffffff" rx="16"/>
<text x="32" y="35" class="heading">完整任务流：用户提出需求，角色按文档接续</text>
<rect x="380" y="65" width="420" height="95" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="398" y="94" class="heading">① 用户：需求与授权</text>
<text x="398" y="120" class="line">确定本期目标；决定范围外与生产事项</text>
<polyline points="590,160 590,185" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="380" y="185" width="420" height="95" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="398" y="214" class="heading">② 规划者：归属、设计与拆分</text>
<text x="398" y="240" class="line">先定需求根，再写 PRD / TODO</text>
<text x="398" y="263" class="line">独立需求同级；原 AC 返修留原包</text>
<polyline points="590,280 590,305" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="380" y="305" width="420" height="95" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="398" y="334" class="heading">③ 协调者：派单与并发补位</text>
<text x="398" y="360" class="line">依赖齐全、范围已授权、文件与资源不冲突</text>
<polyline points="590,400 590,420 210,420 210,445" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="45" y="445" width="330" height="95" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="63" y="474" class="heading">④ 执行者 A</text>
<text x="63" y="500" class="line">专属分支 / worktree</text>
<text x="63" y="523" class="line">开发、自测、冻结 commit 与交付</text>
<polyline points="210,540 210,563 590,563 590,585" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="590,400 590,420 585,420 585,445" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="420" y="445" width="330" height="95" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="438" y="474" class="heading">④ 执行者 B</text>
<text x="438" y="500" class="line">专属分支 / worktree</text>
<text x="438" y="523" class="line">开发、自测、冻结 commit 与交付</text>
<polyline points="585,540 585,563 590,563 590,585" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="590,400 590,420 960,420 960,445" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="795" y="445" width="330" height="95" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="813" y="474" class="heading">④ 执行者 C</text>
<text x="813" y="500" class="line">专属分支 / worktree</text>
<text x="813" y="523" class="line">开发、自测、冻结 commit 与交付</text>
<polyline points="960,540 960,563 590,563 590,585" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="380" y="585" width="420" height="95" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="398" y="614" class="heading">⑤ 测试者：独立验证</text>
<text x="398" y="640" class="line">固定快照、真实环境、命令与运行证据</text>
<polyline points="590,680 590,705" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="380" y="705" width="420" height="110" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="398" y="734" class="heading">⑥ 协调者：审核与收口</text>
<text x="398" y="760" class="line">OCR 固定入口 → 独立服务 → 核覆盖</text>
<text x="398" y="783" class="line">核测试、发现与适用强审查，批准后合入</text>
<rect x="840" y="600" width="325" height="112" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="858" y="629" class="heading">按风险追加强审查</text>
<text x="858" y="655" class="line">授权内自动 / 无授权人工</text>
<text x="858" y="678" class="line">只纠错既定需求，不无限扩单</text>
<polyline points="1000,712 1000,760 800,760" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<polyline points="380,758 22,758 22,352 380,352" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<text x="40" y="739" class="note">返修 / 接受后继续派单</text>
<polyline points="590,815 590,840" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="380" y="840" width="420" height="80" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="398" y="869" class="heading">⑦ 本期完成：交付结果与证据</text>
<text x="398" y="895" class="line">保存恢复入口，关闭专项周期任务</text>
<text x="35" y="950" class="note">效果与原 AC 优先；工程闭环 ≠ 生产启用。只冻结受影响门禁，独立任务继续；文档保留身份与证据。</text>
</svg>
