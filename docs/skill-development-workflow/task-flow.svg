<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1220" viewBox="0 0 1200 1220" role="img" aria-labelledby="title desc">
<title id="title">完整任务流：用户提出需求，角色按文档接续</title><desc id="desc">规划者形成架构和任务，开发与测试领取时脚本通知、完成时模型总结，独立服务审查后按门禁合入。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#0f172a}.heading{font-size:21px;font-weight:700}.line{font-size:16px}.note{font-size:14px;fill:#475569}</style>
<rect width="1200" height="1220" fill="#ffffff" rx="16"/>
<text x="32" y="35" class="heading">完整任务流：用户提出需求，角色按文档接续</text>
<rect x="380" y="65" width="420" height="95" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="398" y="94" class="heading">① 用户：需求与授权</text>
<text x="398" y="120" class="line">确定本期目标；决定范围外与生产事项</text>
<polyline points="590,160 590,185" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="380" y="185" width="420" height="95" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="398" y="214" class="heading">② 规划者：归属、设计与拆分</text>
<text x="398" y="240" class="line">先定需求根，再写 PRD / TODO</text>
<text x="398" y="263" class="line">独立需求同级；原 AC 返修留原包</text>
<polyline points="590,280 590,305" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="380" y="305" width="420" height="95" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="398" y="334" class="heading">③ 协调者：派单与并发补位</text>
<text x="398" y="360" class="line">依赖齐全、范围已授权、文件与资源不冲突</text>
<polyline points="590,400 590,420 210,420 210,445" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="45" y="445" width="330" height="120" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="63" y="474" class="heading">④ 执行者 A</text>
<text x="63" y="500" class="line">固定base准备分支 / worktree</text>
<text x="63" y="523" class="line">原生领取 → 工作单 / 事件 / 通知</text>
<text x="63" y="546" class="line">开发自测交付 → 模型总结</text>
<polyline points="210,565 210,588 590,588 590,610" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="590,400 590,420 585,420 585,445" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="420" y="445" width="330" height="120" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="438" y="474" class="heading">④ 执行者 B</text>
<text x="438" y="500" class="line">固定base准备分支 / worktree</text>
<text x="438" y="523" class="line">原生领取 → 工作单 / 事件 / 通知</text>
<text x="438" y="546" class="line">开发自测交付 → 模型总结</text>
<polyline points="585,565 585,588 590,588 590,610" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="590,400 590,420 960,420 960,445" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="795" y="445" width="330" height="120" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="813" y="474" class="heading">④ 执行者 C</text>
<text x="813" y="500" class="line">固定base准备分支 / worktree</text>
<text x="813" y="523" class="line">原生领取 → 工作单 / 事件 / 通知</text>
<text x="813" y="546" class="line">开发自测交付 → 模型总结</text>
<polyline points="960,565 960,588 590,588 590,610" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="380" y="610" width="420" height="120" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="398" y="639" class="heading">⑤ 测试者：独立验证</text>
<text x="398" y="665" class="line">固定被测commit准备checkout</text>
<text x="398" y="688" class="line">原生领取 → 工作单 / 事件 / 开工通知</text>
<text x="398" y="711" class="line">独立验证交付 → 原生模型总结</text>
<polyline points="590,730 590,755" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="380" y="755" width="420" height="110" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="398" y="784" class="heading">⑥ 协调者：候选审核与合入</text>
<text x="398" y="810" class="line">OCR waiting≤1 两批，其他一批 → results</text>
<text x="398" y="833" class="line">独立测试与旧FAIL闭环；原门禁满足再合入</text>
<rect x="840" y="625" width="325" height="135" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="858" y="654" class="heading">按风险追加强审查</text>
<text x="858" y="680" class="line">授权内自动 / 无授权人工</text>
<text x="858" y="703" class="line">独立 service 跨 cron 生命周期</text>
<text x="858" y="726" class="line">只纠错既定需求，不扩单</text>
<polyline points="1000,760 1000,810 800,810" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<polyline points="380,808 22,808 22,352 380,352" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<text x="40" y="789" class="note">返修 / 接受后继续派单</text>
<polyline points="590,865 590,890" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="380" y="890" width="420" height="110" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="398" y="919" class="heading">⑦ TESTER：集成本地义务</text>
<text x="398" y="945" class="line">固定SHA；逐AC场景 / 断言 / case / 环境</text>
<text x="398" y="968" class="line">AC10先形成报告索引，不等待协调收口</text>
<polyline points="590,1000 590,1025" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="380" y="1025" width="420" height="110" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="398" y="1054" class="heading">⑧ 协调者：逐项复核与本地收口</text>
<text x="398" y="1080" class="line">核覆盖语义 / 问题处置 / 原审查及写者退出</text>
<text x="398" y="1103" class="line">真实节点 / 生产义务单独保留，不记完成</text>
<text x="35" y="1195" class="note">效果与原 AC 优先；阶段依赖只允许有匹配契约的开发提前开始，不放宽集成/验收；工程闭环 ≠ 生产启用。</text>
</svg>
