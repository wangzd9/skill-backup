<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-labelledby="title desc">
<title id="title">触发机制：人工对话保留，业务执行互斥</title><desc id="desc">自然语言交给模型；明确业务才入队，共用角色租约；脚本处理机械工作。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#0f172a}.heading{font-size:21px;font-weight:700}.line{font-size:16px}.note{font-size:14px;fill:#475569}</style>
<rect width="1200" height="960" fill="#ffffff" rx="16"/>
<text x="32" y="35" class="heading">触发机制：人工对话保留，业务执行互斥</text>
<rect x="30" y="75" width="350" height="110" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="48" y="104" class="heading">明确业务待办</text>
<text x="48" y="130" class="line">模型先回应，明确动作才保存</text>
<text x="48" y="153" class="line">原生身份去重，保留原文与引用</text>
<rect x="415" y="75" width="370" height="110" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="433" y="104" class="heading">五分钟检查 / 同一角色 poll</text>
<text x="433" y="130" class="line">读文档 / 固定任务采样 / 操作结果</text>
<text x="433" y="153" class="line">写 tick 与 pending；忙碌只排队</text>
<polyline points="380,130 415,130" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="820" y="75" width="350" height="110" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="838" y="104" class="heading">绑定角色群负载查询</text>
<text x="838" y="130" class="line">直接 GET /metrics 后答复</text>
<text x="838" y="153" class="line">需要原因解释时才交给模型</text>
<polyline points="600,185 600,235" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="415" y="235" width="370" height="125" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="433" y="264" class="heading">有未处理输入或结果变化？</text>
<text x="433" y="290" class="line">心跳 / 自写观察不反复唤醒</text>
<text x="433" y="313" class="line">暂停 cron 不因入队自动启用</text>
<polyline points="415,290 210,290 210,405" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="130" y="280" class="note">否 / 当前忙碌</text>
<rect x="30" y="405" width="350" height="110" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="48" y="434" class="heading">结束检查或保留待处理输入</text>
<text x="48" y="460" class="line">不调用模型 / 不重启现有工作</text>
<text x="48" y="483" class="line">进程未知需对账，不推断成功</text>
<polyline points="785,290 1000,290 1000,405" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="890" y="280" class="note">是且可接续</text>
<rect x="820" y="405" width="350" height="110" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="838" y="434" class="heading">协调模型：群或后台</text>
<text x="838" y="460" class="line">取得共同租约后复读任务 / 证据</text>
<text x="838" y="483" class="line">已处理不重做，忙碌不抢占</text>
<polyline points="995,515 995,560" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="820" y="560" width="350" height="125" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="838" y="589" class="heading">记录处理证据与确认</text>
<text x="838" y="615" class="line">observer ack 只确认观察指纹</text>
<text x="838" y="638" class="line">queue-ack 只消费对应群请求</text>
<text x="838" y="661" class="line">旧确认不能吞掉新输入</text>
<rect x="30" y="560" width="710" height="125" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="48" y="589" class="heading">固定工程操作：doctor → start → 状态变化接续</text>
<text x="48" y="615" class="line">固定采样 / 安全记账 / 测试证据；冻结输入、独立 systemd</text>
<text x="48" y="638" class="line">gzip 先解压，非零即停；保留退出码、日志和进程身份</text>
<text x="48" y="661" class="line">命令成功不代表业务 PASS；OCR / 强审仍用原唯一入口</text>
<polyline points="740,620 780,620 780,210 600,210 600,235" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<rect x="30" y="745" width="1140" height="110" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="48" y="774" class="heading">统一角色报告：固定报告 no_agent=true</text>
<text x="48" y="800" class="line">协调者白天 20 分钟、08 点夜间汇总；执行者 / 测试者 11 / 15 / 18 点</text>
<text x="48" y="823" class="line">21–08 点只落盘；白天有意义变化即时报告，无变化仅本地记录</text>
<text x="48" y="846" class="line">同一事实 → 按角色报告视图；协调者完整七区，其他角色仅自身工作</text>
<text x="32" y="898" class="note">系统 / 工具前缀只读审计，不屏蔽合法规则更新，不改推理参数；所有测试、OCR、强审查与合入门禁保留。</text>
<text x="32" y="930" class="note">人工问答走原生模型，不自动入队；原生 slash 控制保留；实际延迟受在途回合与模型队列影响。</text>
</svg>
