<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">上下文与归档：当前材料足够接续，原始证据完整保留</title><desc id="desc">业务读取最新checkpoint与全部未完成索引，按需展开原文；完整记录归档，并在自然安全点持久保存下一动作。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#0f172a}.heading{font-size:21px;font-weight:700}.line{font-size:16px}.note{font-size:14px;fill:#475569}</style>
<rect width="1200" height="820" fill="#ffffff" rx="16"/>
<text x="32" y="35" class="heading">上下文与归档：当前材料足够接续，原始证据完整保留</text>
<rect x="35" y="75" width="530" height="135" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="53" y="104" class="heading">① ACTIVE 工作单 → 当前输入快照</text>
<text x="53" y="130" class="line">当前工作、全部阶段义务与 FAIL / UNKNOWN</text>
<text x="53" y="153" class="line">完整待决目录；按对象准备，不自动填裁决</text>
<text x="53" y="176" class="line">事件续读不重发整包；未展开 ≠ 已读</text>
<rect x="635" y="75" width="530" height="135" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="653" y="104" class="heading">② 参考材料：canonical路径 + SHA</text>
<text x="653" y="130" class="line">role_decision_context：合同 / 对象 / 完整引用</text>
<text x="653" y="153" class="line">账本同源；Git与原文件单独采样</text>
<text x="653" y="176" class="line">历史记忆核依赖；旧单检查点不冒充当前</text>
<polyline points="565,140 635,140" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="300,210 300,260" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="35" y="260" width="530" height="160" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="53" y="289" class="heading">③ 追加日志：完整记录轮转</text>
<text x="53" y="315" class="line">64KiB或400行 → 完整归档</text>
<text x="53" y="338" class="line">当前 ≤48KiB、最近最多30条；大单条留证据引用</text>
<text x="53" y="361" class="line">稳定文档锁 + 可恢复journal + 持久event索引</text>
<text x="53" y="384" class="line">checkpoint保留全部未完成定位，不漏旧任务</text>
<rect x="635" y="260" width="530" height="160" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="653" y="289" class="heading">④ TODO / HANDOFF：语义归档</text>
<text x="653" y="315" class="line">保留未完成、依赖、返修、授权、门禁、在途身份</text>
<text x="653" y="338" class="line">完成历史完整归档，当前保留ID / 状态 / 证据</text>
<text x="653" y="361" class="line">不能简单tail或按字节截断；历史按需精确回查</text>
<text x="653" y="384" class="line">归档是维护动作，不制造业务进展或重复唤醒</text>
<polyline points="565,340 635,340" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="900,420 900,470" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="635" y="470" width="530" height="135" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="653" y="499" class="heading">⑤ 自然安全点：continuation</text>
<text x="653" y="525" class="line">保存task / attempt、已做证据、下一动作与幂等身份</text>
<text x="653" y="548" class="line">输入不可变冻结；旧缺失精确恢复，不假ACK</text>
<text x="653" y="571" class="line">后续回合先对账再接续，处理后确认对应continuation</text>
<rect x="35" y="470" width="530" height="135" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="53" y="499" class="heading">⑥ 事件去重：精确确认自己已处理输入</text>
<text x="53" y="525" class="line">相同pending合并；自己的ACK回声不重复唤醒</text>
<text x="53" y="548" class="line">不同派单 / attempt / 服务终态 / 授权变化仍保留</text>
<text x="53" y="571" class="line">两条 ACK 按启动水位计进展；新事件可接续</text>
<polyline points="635,540 565,540" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="35" y="665" width="1130" height="100" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="53" y="694" class="heading">报告材料独立：role-status / summary-input</text>
<text x="53" y="720" class="line">20分钟仅六态角色状态；时段总结采集本人真实路由、请求/token/cached/费用和覆盖缺口，晨报也只计本人</text>
<text x="53" y="743" class="line">只读模型整理冻结时段，不claim业务owner、不ACK业务pending；当前总结用量归下一时段，未知不猜为零</text>
<text x="35" y="800" class="note">首次迁移等旧writer到安全点；不停止在途业务，不删原始证据，不把checkpoint当成第二份任务状态。</text>
</svg>
