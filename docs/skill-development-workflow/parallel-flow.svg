<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
<title id="title">三路开发接续：按依赖补位，不等整波结束</title><desc id="desc">示意任务不代表当前项目派单，固定契约后可以并行开发，独立验证后接续下一任务。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#0f172a}.heading{font-size:21px;font-weight:700}.line{font-size:16px}.note{font-size:14px;fill:#475569}</style>
<rect width="1200" height="590" fill="#ffffff" rx="16"/>
<text x="32" y="35" class="heading">三路开发接续：按依赖补位，不等整波结束</text>
<rect x="45" y="70" width="250" height="64" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="63" y="99" class="heading">执行者 A</text>
<rect x="330" y="70" width="250" height="64" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="348" y="99" class="heading">执行者 B</text>
<rect x="615" y="70" width="250" height="64" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="633" y="99" class="heading">执行者 C</text>
<rect x="900" y="70" width="250" height="64" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="918" y="99" class="heading">测试者</text>
<rect x="45" y="165" width="250" height="105" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="63" y="194" class="heading">任务 A1</text>
<text x="63" y="220" class="line">独立开发、自测、交付</text>
<text x="63" y="243" class="line">冻结后按明确释放槽接续</text>
<rect x="330" y="165" width="250" height="105" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="348" y="194" class="heading">任务 B1</text>
<text x="348" y="220" class="line">独立开发、自测</text>
<text x="348" y="243" class="line">可以比 A1 用时更长</text>
<rect x="615" y="165" width="250" height="105" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="633" y="194" class="heading">任务 C1</text>
<text x="633" y="220" class="line">独立开发、自测</text>
<text x="633" y="243" class="line">不改 A1 / B1 所属文件</text>
<polyline points="170,270 170,285 1025,285 1025,270" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<rect x="900" y="165" width="250" height="105" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="918" y="194" class="heading">验证 A1</text>
<text x="918" y="220" class="line">协调者派固定快照</text>
<text x="918" y="243" class="line">PASS 交协调者裁决</text>
<polyline points="1025,270 1025,315 170,315 170,350" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="345" y="306" class="note">协调者接受 A1 → 检查 A2 前置与冲突 → 给 A 派单</text>
<rect x="45" y="350" width="250" height="105" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="63" y="379" class="heading">任务 A2</text>
<text x="63" y="405" class="line">A1 已接受、其他输入齐全</text>
<text x="63" y="428" class="line">从指定新 base 建任务分支</text>
<rect x="330" y="350" width="250" height="105" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="348" y="379" class="heading">任务 B1 继续</text>
<text x="348" y="405" class="line">不因 A1 审查结束而重启</text>
<text x="348" y="428" class="line">不必等待三路同时结束</text>
<rect x="615" y="350" width="250" height="105" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="633" y="379" class="heading">任务 C1 / 等待</text>
<text x="633" y="405" class="line">有共同文件、迁移或资源</text>
<text x="633" y="428" class="line">按实际约束保留必要串行</text>
<rect x="900" y="350" width="250" height="105" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="918" y="379" class="heading">验证下一稳定交付</text>
<text x="918" y="405" class="line">独立测试槽持续接续</text>
<text x="918" y="428" class="line">不代批准、不代业务修复</text>
<text x="45" y="504" class="line">若 A2 必须依赖 B1，则不能提前派；若共享迁移 / GPU / 文件，由协调者指定 owner 并串行。</text>
<text x="45" y="540" class="line">强审查、OCR 或授权等待只暂停相关门禁；冻结交付可在协调者释放槽后接无冲突任务。</text>
<text x="45" y="572" class="note">本图仅解释调度方式，不新增产品需求、实际任务编号或开发授权。</text>
</svg>
