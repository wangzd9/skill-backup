providers:
  qwen-a100:
    base_url: http://192.168.2.45:8002/v1
    api_mode: chat_completions
    discover_models: false
    models:
    - /home/sysadmin/data/disk02/jc/models/qwen3.8-27b-fp8
    api_key: LOCAL_API_KEY_PLACEHOLDER
  numenume-cloud:
    name: numenume-cloud
    base_url: https://sub.numenume.site/v1
    default_model: deepseek-v4-pro
    api_mode: chat_completions
    key_env: NUMENUME_API_KEY
    extra_body:
      store: false
  sub2api-deepseek:
    name: Sub2API DeepSeek
    base_url: https://sub.vankit.top/v1
    default_model: deepseek-v4-pro
    api_mode: responses
    key_env: SUB2API_API_KEY
    extra_body:
      store: false
  xcoding-cloud:
    name: x-coding OpenAI
    base_url: https://x-coding.net/v1
    default_model: gpt-6.1-sol
    api_mode: responses
    key_env: XCODING_API_KEY
    extra_body:
      store: false
plugins:
  entries:
    role-workflow-runtime:
      enabled: true
      settings:
        registry: /home/USER/.hermes/role-projects.json
        metrics_url: http://192.168.2.45:8002/metrics
        coordinator_chat_ids: []
        load_query_chat_ids: []
        model_routing:
          enabled: true
          cloud_provider: custom:xcoding-cloud
          cloud_model: gpt-6.1-sol
          cloud_key_env: SUB2API_API_KEY
          local_provider: qwen-a100
          local_model: /home/sysadmin/data/disk02/jc/models/qwen3.8-27b-fp8
          pipeline_url: http://192.168.2.134:8180/api/v1/pipeline-runs
          default_cloud_profile: xcoding
          ocr_enabled: true
          ocr_profile: xcoding
          cloud_profiles:
            sub2api:
              cloud_provider: custom:sub2api-deepseek
              cloud_model: deepseek-v4.1-flash
              cloud_key_env: SUB2API_API_KEY
            xcoding:
              cloud_provider: custom:xcoding-cloud
              cloud_model: gpt-6.1-sol
              cloud_key_env: XCODING_API_KEY
            numenume:
              cloud_provider: custom:numenume-cloud
              cloud_model: deepseek-v4-pro
              cloud_key_env: NUMENUME_API_KEY
agent:
  reasoning_overrides:
    gpt-6.1-sol: high
  reasoning_effort: high
